name: PidginBots Daily Hunt

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Lagos, every day
  workflow_dispatch:       # manual run button

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the hunt
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 engine/run.py

      - name: Commit fresh digest
        run: |
          git config user.name "pidginbots-engine"
          git config user.email "engine@pidginbots.local"
          git add docs/digest.json engine/state.json
          git commit -m "daily digest: $(date -u +%Y-%m-%d)" || echo "no changes"
          git pull --rebase origin main
          git push
